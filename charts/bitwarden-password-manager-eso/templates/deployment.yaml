apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bitwarden-password-manager-eso.fullname" . }}
  labels:
    {{- include "bitwarden-password-manager-eso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bitwarden-password-manager-eso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bitwarden-password-manager-eso.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- if not .Values.bitwarden.existingSecret }}
      annotations:
        # Restart on credential changes; a running bw serve keeps its session.
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "bitwarden-password-manager-eso.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bitwarden-cli
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.command .Values.args }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else if .Values.bwServe.disableOriginProtection }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- include "bitwarden-password-manager-eso.serveScript" . | nindent 14 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "bitwarden-password-manager-eso.credentialsSecretName" . }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}