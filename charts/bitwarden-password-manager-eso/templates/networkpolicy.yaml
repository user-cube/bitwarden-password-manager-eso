{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bitwarden-password-manager-eso.fullname" . }}
  labels:
    {{- include "bitwarden-password-manager-eso.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bitwarden-password-manager-eso.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- if .Values.sync.enabled }}
        - podSelector:
            matchLabels:
              {{- include "bitwarden-password-manager-eso.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: sync
        {{- end }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
