replicaCount: 1

image:
  repository: ghcr.io/charlesthomas/bitwarden-cli
  pullPolicy: IfNotPresent
  tag: "2026.10.1"

bwServe:
  # Recent CLI versions reject requests whose Host header isn't localhost,
  # which is every request routed through the Service, so External Secrets
  # Operator gets 403s. When true, the container runs the image's
  # entrypoint.sh logic with `--disable-origin-protection` added to
  # `bw serve`; when false, the image's entrypoint.sh runs unchanged.
  # Ignored when `command` or `args` are set.
  disableOriginProtection: true

# Override the image's own ENTRYPOINT/CMD. Empty by default. Takes
# precedence over bwServe.disableOriginProtection.
command: []
args: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Bitwarden credentials - override with SOPS-encrypted values
# See docs/sops-secrets.md for details
bitwarden:
  # Name of an existing Secret with the keys BW_HOST, BW_USER, BW_PASSWORD
  # and optionally BW_CLIENTID/BW_CLIENTSECRET. When set, the chart does not
  # create its own credentials Secret and ignores the values below.
  existingSecret: ""
  host: "https://vault.bitwarden.com"
  username: ""
  password: ""
  clientId: ""
  clientSecret: ""

# Periodic sync configuration
sync:
  enabled: false
  schedule: "0 * * * *" # Every hour
  # curl --max-time for the POST /sync request.
  timeoutSeconds: 30
  image:
    repository: curlimages/curl
    tag: 8.23.0
  resources:
    limits:
      cpu: 50m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

# ClusterSecretStore definitions
clusterSecretStores:
  - name: bitwarden-login
    jsonPath: "$.data.login.username"
  - name: bitwarden-password
    jsonPath: "$.data.login.password"
  - name: bitwarden-fields
    jsonPath: "$.data.fields"
  # One custom field by name: remoteRef.key = item ID, remoteRef.property =
  # field name. ESO renders remoteRef into the jsonPath before evaluating it.
  - name: bitwarden-field
    jsonPath: "$.data.fields[?(@.name==\"{{ .remoteRef.property }}\")].value"
  - name: bitwarden-notes
    jsonPath: "$.data.notes"
  - name: bitwarden-attachments
    jsonPath: "$.data.attachments"
  # Fields of an SSH Key item type.
  - name: bitwarden-ssh-private-key
    jsonPath: "$.data.sshKey.privateKey"
  - name: bitwarden-ssh-public-key
    jsonPath: "$.data.sshKey.publicKey"
  - name: bitwarden-ssh-fingerprint
    jsonPath: "$.data.sshKey.keyFingerprint"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Applied to both the Deployment and the sync CronJob.
nodeSelector: {}
tolerations: []
affinity: {}

# Restrict who can reach `bw serve`. It serves the unlocked vault without
# authentication, so by default any pod in the cluster can read it.
networkPolicy:
  enabled: false
  # Namespaces allowed to call bw serve (External Secrets Operator).
  allowedNamespaces:
    - external-secrets
  # Extra ingress peers (NetworkPolicyPeer list), e.g. a monitoring namespace.
  extraFrom: []
